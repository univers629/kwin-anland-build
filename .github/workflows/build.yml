name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      debian_suite:
        description: Debian suite whose kwin source is built
        required: false
        default: trixie

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Show host
        run: |
          uname -a
          cat /etc/os-release
          dpkg --print-architecture

      - name: Run builder in a Debian container
        env:
          SUITE: ${{ github.event.inputs.debian_suite || 'trixie' }}
        run: |
          set -eux
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e SUITE="$SUITE" \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:"$SUITE" \
            bash -c '
              set -eux
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential devscripts equivs dpkg-dev patch fakeroot \
                ca-certificates curl xz-utils git
              bash ./scripts/build-in-container.sh 2>&1 | tee /work/build.log
            '

      - name: Collect artifacts
        if: always()
        run: |
          set -eux
          mkdir -p out
          find "$PWD/build" -name 'libkwin6_*.deb' -exec cp -v {} out/ \; || true
          ls -la out
          tail -40 build.log 2>/dev/null || true

      # The one library is the whole deliverable, so the release asset alone is
      # enough; an artifact would only duplicate it behind an API that needs a
      # token to download.
      - name: Publish to release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          shopt -s nullglob
          debs=(out/libkwin6_*.deb)
          [ ${#debs[@]} -gt 0 ] || { echo "no package to publish"; exit 1; }
          tag="build-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" "${debs[@]}" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "libkwin6 with the anland backend, built from ${{ github.sha }}."

